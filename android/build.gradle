group 'com.lykhonis.imagecrop'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()  // ← jcenter() is shutdown, replace everywhere
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'  // ← was 3.4.1
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()  // ← jcenter() is shutdown, replace everywhere
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.lykhonis.imagecrop'  // ← ADD: required for AGP 8+
    compileSdk 35                        // ← was compileSdkVersion 28

    defaultConfig {
        minSdk 21                        // ← was 16 (Flutter 3.x minimum is 21)
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17  // ← ADD
        targetCompatibility JavaVersion.VERSION_17  // ← ADD
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'  // ← was 1.0.0
}